name: Build AppHub (Android APK & Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AppHub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Build Windows Executable (Electron)
        run: npx electron-builder --win --publish never

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: AppHub-Windows-EXE
          path: release/*.exe
          if-no-files-found: warn

  publish-release:
    name: Publish Release Packages
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: AppHub-Android-APK
          path: release-assets
        continue-on-error: true

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: AppHub-Windows-EXE
          path: release-assets
        continue-on-error: true

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-release
          find release-assets/ -name "*.apk" -exec cp {} dist-release/AppHub.apk \; 2>/dev/null || true
          find release-assets/ -name "*.exe" -exec cp {} dist-release/AppHub-Setup.exe \; 2>/dev/null || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AppHub Official Release
          body: |
            Descargas oficiales de AppHub:
            - **Windows**: `AppHub-Setup.exe` (Instalador nativo de escritorio)
            - **Android**: `AppHub.apk` (Paquete nativo)
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

